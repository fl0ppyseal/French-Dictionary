<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">

<title>Dictionnaire – French ⇄ English</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📕</text></svg>">
<style>
:root{--bg:#0a0a0b;--card:#151517;--ink:#f5f2ed;--mut:#9b958c;--acc:#ff7a1a;--line:#2a2a2e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 420px at 50% -120px,rgba(255,122,26,.22),transparent 70%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:48px 16px 56px}
h1{font:700 3rem/1.05 "Iowan Old Style",Georgia,serif;margin:0;letter-spacing:-1px;cursor:pointer}
h1::after{content:".";color:var(--acc)}
.sub{color:var(--mut);margin:6px 0 20px}
input{width:100%;font:inherit;font-size:1.15rem;padding:15px 18px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--mut)}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,122,26,.18)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;transition:border-color .15s,color .15s}
button:hover{border-color:var(--acc);color:var(--acc)}
button.on,button.on:hover{background:var(--acc);color:#0a0a0b;border-color:var(--acc);font-weight:600}
.modes,.abc{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.abc button{padding:3px 11px;font-size:.9rem}
.cnt{color:var(--mut);font-size:.88rem;margin:6px 0 12px}
.r{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:14px 18px;margin:10px 0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fr{font:700 1.45rem/1.2 "Iowan Old Style",Georgia,serif}
.pos{color:var(--acc);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}
.top button{margin-left:auto;padding:2px 10px;font-size:.9rem}
.en{color:var(--ink);margin-top:4px}
.tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700;margin:22px 0 -4px}
.none{text-align:center;color:var(--mut);padding:36px 0}
</style>

<h1 id="t">Dictionnaire</h1>
<p class="sub">French ⇄ English. Search in either language.</p>
<input id="q" type="search" placeholder="Search a word… chat, cat, s’il vous plaît" autocomplete="off" autocapitalize="none" spellcheck="false">
<div class="modes" id="modes"></div>
<div id="out"></div>

const P={m:"masc. noun",f:"fem. noun",v:"verb",a:"adj.",d:"adv.",p:"prep.",c:"conj.",r:"pronoun",n:"number",x:"phrase"};
const N=s=>s.toLowerCase().replace(/’/g,"'").replace(/œ/g,"oe").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const W=DATA.trim().split("\n").map(l=>{const[f,p,t]=l.split("|"),e=t.split(", ");return{f,p,e,fk:N(f),ek:e.map(x=>N(x.replace(/\(.*?\)/g,"")).replace(/^to /,"").trim())}});
const $=id=>document.getElementById(id);
let m="auto";
const sc=(k,q)=>k==q?3:k.startsWith(q)?2:(" "+k).includes(" "+q)?1:0;
function look(raw){const q0=N(raw).replace(/^to /,"");if(!q0)return[];
const run=q=>W.map(w=>{let s=0;if(m!="en")s=sc(w.fk,q);if(m!="fr")s=Math.max(s,...w.ek.map(k=>sc(k,q)));return{w,s}}).filter(x=>x.s).sort((a,b)=>b.s-a.s||a.w.f.length-b.w.f.length);
let r=run(q0);if(!r.length&&q0.length>3&&/[sx]$/.test(q0))r=run(q0.slice(0,-1));return r.slice(0,40).map(x=>x.w)}
const card=w=>'<div class="r"><div class="top"><b class="fr">'+w.f+'</b><span class="pos">'+P[w.p]+'</span><button data-s="'+w.f+'" title="Listen">🔊</button></div><div class="en">'+w.e.join(" · ")+'</div></div>';
function modes(){$("modes").innerHTML=[["auto","Both ways"],["fr","French → English"],["en","English → French"]].map(a=>'<button data-m="'+a[0]+'"'+(a[0]==m?' class="on"':'')+'>'+a[1]+'</button>').join("")}
function home(){$("q").value="";const w=W[Math.floor(Date.now()/864e5)%W.length];
$("out").innerHTML='<div class="tag">Word of the day</div>'+card(w)+'<div class="tag">Browse A–Z</div><div class="abc">'+"ABCDEFGHIJLMNOPQRSTUVX".split("").map(l=>'<button data-l="'+l+'">'+l+'</button>').join("")+'</div><p class="cnt">'+W.length+' entries. Type above to search French or English.</p>'}
function go(){const q=$("q").value;if(!q.trim())return home();const r=look(q);
$("out").innerHTML=r.length?'<p class="cnt">'+r.length+' result'+(r.length>1?"s":"")+'</p>'+r.map(card).join(""):'<p class="none">No entry found. Try another spelling or the base form of the word.</p>'}
function say(t){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";speechSynthesis.cancel();speechSynthesis.speak(u)}
$("q").addEventListener("input",go);
$("t").onclick=home;
document.addEventListener("click",e=>{const d=e.target.dataset||{};
if(d.m){m=d.m;modes();go()}
if(d.s)say(d.s);
if(d.l){const r=W.filter(w=>w.fk[0]==d.l.toLowerCase()).sort((a,b)=>a.fk<b.fk?-1:1);$("out").innerHTML='<p class="cnt">'+r.length+' words starting with '+d.l+'</p>'+r.map(card).join("")}});
modes();home();
</script>
